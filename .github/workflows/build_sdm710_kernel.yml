name: Build RMX1901-Kernel
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: "sdm670-perf_defconfig"
      KERNEL_CMDLINE: "ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        submodules: 'true'
        fetch-depth: 0
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2.22
    - name: Install dependencies
      run: |
        sudo timedatectl set-timezone Asia/Dhaka
        sudo apt-get update -y
        sudo apt install binutils make python3 libssl-dev build-essential bc bison flex zip unzip xz-utils mkbootimg cpio device-tree-compiler git git-lfs -y
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
        git clone --depth=1 https://github.com/th4rv4/AnyKernel3
        rm -rf AnyKernel3/.git AnyKernel3/.github
    - name: GetTime
      id: get_time
      run: echo "TIME=$(TZ=GMT+06 date +%m%d%H%M)" >> $GITHUB_OUTPUT
    - name: Build Kernel
      id: build_kern
      run: |
        export PATH=$(pwd)/clang/bin/:$PATH
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export ARCH=arm64
        export SUBARCH=arm64
        # LLVM + LTO Flags
        export LLVM=1
        export LLVM_IAS=1
        export LD=ld.lld
        export KBUILD_LTO_CLANG=1
        HOSTCFLAGS="-fuse-ld=lld -Wno-unused-command-line-argument"
        # 1st: defconfig
        make $KERNEL_CMDLINE $KERNEL_DEFCONFIG \
          CC="ccache clang" \
          HOSTCFLAGS="$HOSTCFLAGS"
        # Kernel version
        VERSION=$(make kernelversion)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        # 2nd: full kernel build
        make $KERNEL_CMDLINE CC="ccache clang" -j$(nproc) \
          HOSTCFLAGS="$HOSTCFLAGS"
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3
    - name: Upload Kernel
      uses: actions/upload-artifact@v7.0.1
      with:
        name: RMX1901-Perf-Kernel-${{ steps.build_kern.outputs.VERSION }}-${{ steps.get_time.outputs.TIME }}
        path: "AnyKernel3/*"
    - name: Package AnyKernel3
      id: package
      run: |
        ZIP_NAME="RMX1901-Perf-Kernel-${{ steps.build_kern.outputs.VERSION }}-${{ steps.get_time.outputs.TIME }}.zip"
        cd AnyKernel3
        zip -r9 "../$ZIP_NAME" *
        cd ..
        echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: manual-${{ github.run_number }}
        name: 🌑 BloodMoon Kernel — Build #${{ github.run_number }}
        body: |
          <div align="center">

          ![BloodMoon Kernel](https://img.shields.io/badge/BloodMoon-Kernel-7C3AED?style=for-the-badge&logo=linux&logoColor=white)
          ![Device](https://img.shields.io/badge/Device-RMX1901%20%2F%20RMX1901CN-2563EB?style=for-the-badge)
          ![Status](https://img.shields.io/badge/Build-Passing-22C55E?style=for-the-badge&logo=githubactions&logoColor=white)

          </div>

          ---

          ### 📦 Build Details

          | Field | Value |
          |---|---|
          | 📱 **Device** | RMX1901 / RMX1901CN |
          | 🧬 **Kernel Version** | `${{ steps.build_kern.outputs.VERSION }}` |
          | ⏱️ **Build Time** | `${{ steps.get_time.outputs.TIME }}` |
          | 🔁 **Workflow Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          | 🔗 **Commit** | [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | ⚙️ **Toolchain** | Proton Clang + LLVM |
          | 🧩 **Defconfig** | `sdm670-perf_defconfig` |

          ---

          ### 🚀 Flashing Instructions

          > 1. Reboot to recovery (**OrangeFox** or **TWRP**)
          > 2. Flash the `.zip` below
          > 3. Wipe cache/dalvik (recommended)
          > 4. Reboot to system

          ---

          <div align="center">

          **⚠️ Flash at your own risk — always keep a backup.**

          </div>
        files: ${{ env.ZIP_NAME }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
